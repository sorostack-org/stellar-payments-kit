name: Welcome Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    name: Welcome Message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue! We appreciate your contribution
            to Stellar Payments Kit. Please make sure to follow our contributing guidelines.
          pr-message: >
            Thanks for your first pull request! A maintainer will review it soon.
            Make sure all CI checks pass.
