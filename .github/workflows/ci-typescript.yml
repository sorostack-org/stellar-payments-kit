name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "next.config.ts"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "next.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
