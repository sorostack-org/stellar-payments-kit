name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm audit --production || echo "Audit found vulnerabilities (non-blocking)"
